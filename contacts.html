<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MetloData</title>
    <link rel="icon" type="image/png" href="logo.ico">
    <style>
        /* CSS стили для макета */
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background-image: linear-gradient(#a1f6ff, #006d80); 
        }
        /* Контейнер, который ограничивает ширину контента */
        .container {
            width: 1000px; /* Фиксированная ширина */
            margin: 0 auto; /* Центрирование */
            background-color: white; /* Белый фон контента */
        }

        /* Шапка */
        header {
            background-color: #c4d7e0;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .site-title {
            font-size: 24px;
            font-weight: bold;
        }

        .login-form {
            display: flex;
            gap: 10px;
        }

        .login-form input {
            padding: 5px;
            border: 1px solid #ccc;
        }

        .login-form button {
            padding: 5px 10px;
            background-color: #f0f0f0;
            border: 1px solid #ccc;
            cursor: pointer;
        }

        /* Меню навигации */
        nav {
            background-color: #333;
            color: white;
            padding: 10px 20px;
        }

        nav ul {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            gap: 20px;
        }

        nav ul li a {
            color: white;
            text-decoration: none;
        }

        /* Основной контент */
        main {
            padding: 20px;
        }

        .description {
            margin-bottom: 20px;
        }

        .logo-container {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-container img {
            max-width: 300px;
        }

        /* Подвал */
        footer {
            background-color: #333;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .footer-logos {
            margin-bottom: 10px;
        }

        .footer-logos img {
            height: 30px;
            margin: 0 10px;
        }
    </style>
</head>
<body>

    <div class="container">

        <header>
            <div class="site-title">metlodata.ru</div>
            <form class="login-form">
                <input type="text" placeholder="Логин">
                <input type="password" placeholder="Пароль">
                <button type="submit">Войти</button>
            </form>
        </header>

        <nav>
            <ul>
                <li><a href="index.html">Главная</a></li>
                <li><a href="maps.html">Карты</a></li>
                <li><a href="#">Контакты</a></li>
            </ul>
        </nav>

        <main>
            <div class="description">
                Способы по которым можно связаться.<br>
                    <br>
                    Telegram: @Vitalik_Novikov<br>
                    Почта: metlodata@gmail.com
            </div>

            <div class="logo-container">
                <img src="path_to_logo.png" alt="">
            </div>

        </main>

        <footer>
            <div class="footer-logos">
                <img src="path_to_icon1.png" alt="">
                <img src="path_to_icon2.png" alt="">
            </div>
        </footer>

    </div>

</body>
</html>
