<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MetloData</title>
    <link rel="icon" type="image/png" href="logo.ico">
    <style>
        /* CSS стили для макета */
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background-image: linear-gradient(#a1f6ff, #006d80); 
        }

        /* Контейнер, который ограничивает ширину контента */
        .container {
            width: 1000px; /* Фиксированная ширина */
            margin: 0 auto; /* Центрирование */
            background-color: white; /* Белый фон контента */
        }

        /* Шапка */
        header {
            background-color: #c4d7e0;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .site-title {
            font-size: 24px;
            font-weight: bold;
        }

        .login-form {
            display: flex;
            gap: 10px;
        }

        .login-form input {
            padding: 5px;
            border: 1px solid #ccc;
        }

        .login-form button {
            padding: 5px 10px;
            background-color: #f0f0f0;
            border: 1px solid #ccc;
            cursor: pointer;
        }

        /* Меню навигации */
        nav {
            background-color: #333;
            color: white;
            padding: 10px 20px;
        }

        nav ul {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            gap: 20px;
        }

        nav ul li a {
            color: white;
            text-decoration: none;
        }

        /* Основной контент */
        main {
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center; /* Центрируем всё содержимое main по горизонтали */
        }

        .description {
            text-align: center;
            margin-bottom: 20px;
            font-size: 18px;
        }

        /* Контейнер карты */
        .maps-container {
            display: flex;
            justify-content: right; /* Центрируем карту */
            width: 100%;
            margin-bottom: 15px;
        }

        .maps-container img {
            width: 75%; /* Карта занимает 75% от ширины контента */
            height: auto;
            border: 1px solid #ccc;
        }

        /* Единая панель управления строго под картой */
        .map-bottom-controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: right; /* Центрируем списки внутри панели */
            gap: 25px;
            border-radius: 4px;
            width: 71%; /* Ширина панели теперь совпадает с визуальной шириной карты (75% + рамки/отступы) */
            box-sizing: border-box; /* Чтобы padding не раздувал панель */
        }

        /* Элемент списка с подписью */
        .control-item {
            display: flex;
            align-items: center; /* Выравнивание текста и селекта по вертикальной оси */
            gap: 8px;
        }

        .control-item label {
            font-size: 14px;
            font-weight: bold;
            color: #333;
        }

        /* Красивое оформление самих выпадающих списков */
        .control-item select {
            padding: 6px 10px;
            font-size: 14px;
            border: 1px solid #cccccc;
            border-radius: 4px;
            background-color: #ffffff;
            cursor: pointer;
            outline: none;
        }

        .control-item select:focus {
            border-color: #006d80; /* Цвет рамки при клике */
        }

        /* Подвал */
        footer {
            background-color: #333;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .footer-logos {
            margin-bottom: 10px;
        }

        .footer-logos img {
            height: 30px;
            margin: 0 10px;
        }
    </style>
</head>
<body>

    <div class="container">

        <header>
            <div class="site-title">metlodata.ru</div>
            <form class="login-form">
                <input type="text" placeholder="Логин">
                <input type="password" placeholder="Пароль">
                <button type="submit">Войти</button>
            </form>
        </header>

        <nav>
            <ul>
                <li><a href="index.html">Главная</a></li>
                <li><a href="maps.html">Карты</a></li>
                <li><a href="contacts.html">Контакты</a></li>
            </ul>
        </nav>

        <main>
            <div class="description">
                Композитные карты ECMWF.
            </div>

            <div class="maps-container">
                <img id="forecast-map" src="data/ETR/SPC/scp_cfo_0h.png" alt="Карта погоды">
            </div>

            <div class="map-bottom-controls">
                
                <div class="control-item">
                    <label for="region-select">Регион:</label>
                    <select id="region-select">
                        <option value="ETR">Центр ЕТР</option>
                    </select>
                </div>

                <div class="control-item">
                    <label for="param-select">Карта:</label>
                    <select id="param-select">
                        <option value="SPC">SCP (Индекс суперячеек)</option>
                        <option value="STP">STP (Параметр знач. торнадо)</option>
                    </select>
                </div>

                <div class="control-item">
                    <label for="time-select">Время прогноза:</label>
                    <select id="time-select">
                        <option value="0">00 ч</option>
                        <option value="3">03 ч</option>
                        <option value="6">06 ч</option>
                        <option value="9">09 ч</option>
                        <option value="12">12 ч</option>
                        <option value="15">15 ч</option>
                        <option value="18">18 ч</option>
                        <option value="21">21 ч</option>
                        <option value="24">24 ч</option>
                        <option value="27">27 ч</option>
                        <option value="30">30 ч</option>
                        <option value="33">33 ч</option>
                        <option value="36">36 ч</option>
                        <option value="39">39 ч</option>
                        <option value="42">42 ч</option>
                        <option value="45">45 ч</option>
                        <option value="48">48 ч</option>
                    </select>
                </div>

            </div>
        </main>

        <footer>
            <div class="footer-logos">
                <img src="path_to_icon1.png" alt="">
                <img src="path_to_icon2.png" alt="">
            </div>
        </footer>

    </div>

    <script>
        const regionSelect = document.getElementById('region-select');
        const paramSelect = document.getElementById('param-select');
        const timeSelect = document.getElementById('time-select');
        const mapImage = document.getElementById('forecast-map');

        function updateMap() {
            const region = regionSelect.value;       
            const param = paramSelect.value;         
            const hour = timeSelect.value;           

            // Определяем имя файла в зависимости от выбранного параметра
            let fileNamePrefix;
            if (param === 'SPC') {
                fileNamePrefix = 'scp'; // Если папка SPC, файл начинается на scp
            } else {
                fileNamePrefix = param.toLowerCase(); // В остальных случаях просто переводим в нижний регистр (stp, mucape и т.д.)
            }

            // Собираем правильный путь
            const newSrc = `data/${region}/${param}/${fileNamePrefix}_cfo_${hour}h.png`;
            mapImage.src = newSrc;
        }

        regionSelect.addEventListener('change', updateMap);
        paramSelect.addEventListener('change', updateMap);
        timeSelect.addEventListener('change', updateMap);
    </script>

</body>
</html>
